# The MCP server's identity on the lab: what its tools call and nothing else. It cannot
# read Secrets, change anything in the nvsentinel namespace, or exec outside gpu-operator.
# lab/mint-kubeconfig.sh makes a short-lived kubeconfig from this ServiceAccount.
#
# Never apply this where a real GPU Operator runs: it can exec into and delete any pod in
# the gpu-operator namespace, which is the simulated hostengine only on the lab.
apiVersion: v1
kind: Namespace
metadata:
  name: nvsentinel-mcp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nvsentinel-mcp
  namespace: nvsentinel-mcp
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nvsentinel-mcp-read
rules:
  - apiGroups: [""]
    resources: [nodes, events]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nvsentinel-mcp-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nvsentinel-mcp-read
subjects:
  - kind: ServiceAccount
    name: nvsentinel-mcp
    namespace: nvsentinel-mcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nvsentinel-mcp-read
  namespace: nvsentinel
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nvsentinel-mcp-read
  namespace: nvsentinel
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nvsentinel-mcp-read
subjects:
  - kind: ServiceAccount
    name: nvsentinel-mcp
    namespace: nvsentinel-mcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nvsentinel-mcp-workload-read
  namespace: default
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [gpu-workload]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nvsentinel-mcp-workload-read
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nvsentinel-mcp-workload-read
subjects:
  - kind: ServiceAccount
    name: nvsentinel-mcp
    namespace: nvsentinel-mcp
---
# The only writes: the simulated DCGM pod and its Service, in their namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nvsentinel-mcp-fault
  namespace: gpu-operator
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, delete]
  - apiGroups: [""]
    resources: [pods/exec]
    # Websocket exec needs both on Kubernetes 1.36: the request is a GET, and the API server
    # also checks create. A run with either one alone was refused.
    verbs: [create, get]
  - apiGroups: [""]
    resources: [services]
    resourceNames: [nvidia-dcgm]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nvsentinel-mcp-fault
  namespace: gpu-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nvsentinel-mcp-fault
subjects:
  - kind: ServiceAccount
    name: nvsentinel-mcp
    namespace: nvsentinel-mcp
